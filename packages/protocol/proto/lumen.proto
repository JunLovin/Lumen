syntax = "proto3";

package lumen;

enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 1;
}

message Hello {
  ProtocolVersion protocol_version = 1;
  bytes device_id_hash = 2;
}

message ClockPing {
  uint64 origin_ns = 1;
}

message ClockPong {
  uint64 origin_ns = 1;
  uint64 receive_ns = 2;
  uint64 transmit_ns = 3;
}

message DragFrame {
  uint32 session = 1;
  uint32 sequence = 2;
  uint64 timestamp_ns = 3;
  float x_mm = 4;
  float y_mm = 5;
  float velocity_x_mm_s = 6;
  float velocity_y_mm_s = 7;
  float edge_proximity = 8;
  float object_width_mm = 9;
  float object_height_mm = 10;
  float rotation_rad = 11;
  PhoneEdge edge = 12;
}

message PlayChirpPair {
  uint32 request_id = 1;
}

message AcousticReport {
  uint32 request_id = 1;
  float tau_us = 2;
  float level_difference_db = 3;
  float snr_db = 4;
  int32 accepted_pairs = 5;
}

message Datagram {
  oneof message {
    Hello hello = 1;
    DragFrame drag_frame = 2;
  }
}

message SessionKey {
  bytes x25519_public = 1;
  bytes signature = 2;
}

message SessionReady {
  uint32 realtime_port = 1;
  uint32 file_port = 2;
}

message IncompatibleVersion {
  ProtocolVersion supported = 1;
}

message MotionSettled {}

message BeginLocate {}

enum PhoneEdge {
  PHONE_EDGE_TOP = 0;
  PHONE_EDGE_RIGHT = 1;
  PHONE_EDGE_BOTTOM = 2;
  PHONE_EDGE_LEFT = 3;
}

message EdgeExit {
  PhoneEdge edge = 1;
}

enum PlacementSide {
  PLACEMENT_SIDE_LEFT = 0;
  PLACEMENT_SIDE_RIGHT = 1;
  PLACEMENT_SIDE_BELOW = 2;
  PLACEMENT_SIDE_ABOVE = 3;
  PLACEMENT_SIDE_UNKNOWN = 4;
}

message PlacementUpdate {
  PlacementSide side = 1;
  float confidence = 2;
  repeated float probabilities = 3;
  bool is_detached = 4;
}

message DragBegan {
  uint32 session = 1;
  bytes thumbnail_jpeg = 2;
  float phone_height_mm = 3;
}

message DragEnded {
  uint32 session = 1;
  bool crossed = 2;
  float velocity_x_mm_s = 3;
  float velocity_y_mm_s = 4;
}

message Landed {
  uint32 session = 1;
}

message TransferResource {
  uint32 index = 1;
  string file_name = 2;
  uint64 byte_count = 3;
}

message TransferOffer {
  uint32 transfer_id = 1;
  repeated TransferResource resources = 2;
}

message TransferCancel {
  uint32 transfer_id = 1;
}

message TransferPreparing {
  uint32 transfer_id = 1;
  float fraction = 2;
}

message FileHeader {
  uint32 transfer_id = 1;
  uint32 resource_index = 2;
}

message FileResume {
  uint64 offset = 1;
}

message FileEnd {
  bytes sha256 = 1;
}

message FileAck {
  bool verified = 1;
}

message FileMessage {
  oneof message {
    FileHeader header = 1;
    FileResume resume = 2;
    bytes block = 3;
    FileEnd end = 4;
    FileAck ack = 5;
    bytes probe = 6;
  }
}

message ControlMessage {
  oneof message {
    Hello hello = 1;
    SessionKey session_key = 2;
    SessionReady session_ready = 3;
    IncompatibleVersion incompatible_version = 4;
    ClockPing clock_ping = 5;
    ClockPong clock_pong = 6;
    PlayChirpPair play_chirp_pair = 7;
    AcousticReport acoustic_report = 8;
    MotionSettled motion_settled = 9;
    BeginLocate begin_locate = 10;
    EdgeExit edge_exit = 11;
    PlacementUpdate placement_update = 12;
    DragBegan drag_began = 13;
    DragEnded drag_ended = 14;
    Landed landed = 15;
    TransferOffer transfer_offer = 16;
    TransferCancel transfer_cancel = 17;
    TransferPreparing transfer_preparing = 18;
  }
}

message PairingCommit {
  bytes commitment = 1;
}

message PairingKey {
  bytes x25519_public = 1;
  bytes nonce = 2;
}

message PairingSealed {
  bytes sealed_box = 1;
}

message PairingIdentity {
  bytes device_id = 1;
  bytes signing_public = 2;
  string name = 3;
}

message PairingConfirmed {
  bytes confirmation = 1;
}

message PairingMessage {
  oneof message {
    PairingCommit commit = 1;
    PairingKey key = 2;
    PairingSealed sealed = 3;
    PairingConfirmed confirmed = 4;
  }
}
