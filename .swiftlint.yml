strict: true
disabled_rules:
  - trailing_comma
included:
  - packages/LumenKit/Sources
  - packages/LumenKit/Tests
  - apps/macos/Lumen
  - apps/ios/native
excluded:
  - packages/LumenKit/Sources/LumenProtocol/Generated
  - packages/LumenKit/Sources/LumenMacUI/Generated
file_length:
  warning: 200
  error: 300
cyclomatic_complexity:
  ignores_case_statements: true
identifier_name:
  excluded: [x, y, id]
line_length:
  warning: 120
  error: 160
custom_rules:
  pure_core_imports_only_own_modules:
    name: Pure core imports
    regex: '^\s*(@preconcurrency\s+)?import\s+(?!LumenDomain\b)\w+'
    included:
      - 'packages/LumenKit/Sources/LumenDomain/'
      - 'packages/LumenKit/Sources/LumenApplication/'
    message: Domain and application import only the domain, never a framework.
    severity: error
