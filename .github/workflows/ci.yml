name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: brew install protobuf swiftlint swiftformat
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pod install
        working-directory: apps/ios/ios
      - run: >-
          xcodebuild build
          -workspace Lumen.xcworkspace
          -scheme Lumen
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          -quiet
        working-directory: apps/ios/ios
